<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f366f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Nunito:wght@400;700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved light/dark choice and theme colors before the page paints (avoids a flash).
      try {
        var m = localStorage.getItem('hs-mode')
        if (m !== 'light' && m !== 'dark') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = m
        var ui = localStorage.getItem('hs-ui')
        if (ui) document.documentElement.dataset.palette = ui
      } catch (e) {}
    </script>
    <title>Hamilton Scheduler · Hamilton College Course Planner by HamApps</title>
    <meta
      name="description"
      content="Plan your Hamilton College semester: search the course catalog, build schedules on a weekly calendar, and export them to your calendar."
    />
    <link rel="canonical" href="https://scheduler.hamapps.dev/" />
    <!-- How links to the site look when shared (iMessage, Discord, Instagram, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scheduler.hamapps.dev/" />
    <meta property="og:title" content="Hamilton Scheduler" />
    <meta
      property="og:description"
      content="Plan your Hamilton College semester: search courses, build schedules and export them to your calendar."
    />
    <meta property="og:image" content="https://scheduler.hamapps.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Hamilton Scheduler logo: the HamApps box cat inside a calendar" />
    <meta property="og:site_name" content="HamApps" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <!-- Tells search engines this app is made by HamApps. The "#organization" id matches the one on
         hamapps.dev (and HamEats), so Google ties the club's sites together. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://scheduler.hamapps.dev/#app",
            "name": "Hamilton Scheduler",
            "alternateName": ["Hamilton College Scheduler", "HamApps Scheduler"],
            "url": "https://scheduler.hamapps.dev/",
            "image": "https://scheduler.hamapps.dev/og-image.png",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web",
            "description": "Plan your Hamilton College semester: search the course catalog, build schedules on a weekly calendar, and export them to your calendar.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "publisher": { "@id": "https://hamapps.dev/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://hamapps.dev/#organization",
            "name": "HamApps",
            "url": "https://hamapps.dev/",
            "logo": "https://hamapps.dev/hamapps-logo.png"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
