AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The role GitHub Actions uses to run `sst deploy --stage production` for the Hamilton Scheduler on every push to
  main (.github/workflows/deploy.yml). Only the main branch of HamAppsDev/HamiltonScheduler can use it. Deploy in
  us-east-2 (the project's Region):

    aws cloudformation deploy --profile hamapps --region us-east-2 --stack-name hamilton-scheduler-github \
      --template-file infra/github-deploy-role.yaml --capabilities CAPABILITY_NAMED_IAM

Parameters:
  GitHubRepo:
    Type: String
    Default: HamAppsDev/HamiltonScheduler
    Description: owner/name of the repository whose main branch may deploy.
  GitHubSubPrefix:
    Type: String
    Default: repo:HamAppsDev@359968926/HamiltonScheduler@1470434569
    Description: >-
      The same repository as GitHub now names it in its sign-in tokens (owner@id/name@id; see
      `gh api repos/OWNER/NAME/actions/oidc/customization/sub`). Accepted along with the plain owner/name form.

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hamilton-scheduler-github-deploy
      Description: GitHub Actions deploys the Hamilton Scheduler with SST (main branch only).
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            # GitHub's identity provider already exists in this project (made by the hameats stack).
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:ref:refs/heads/main
                  - !Sub ${GitHubSubPrefix}:ref:refs/heads/main
      # SST touches many services (S3, CloudFront, Lambda, SNS, EventBridge, SSM for its state, ACM in us-east-1 for the
      # domain). PowerUserAccess covers those but no IAM, so the IAM it needs is added below, limited to the roles SST
      # names for this app (hamilton-scheduler-production-*). It can't create or change any other role or user.
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: sst-app-roles-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/hamilton-scheduler-production-*

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
